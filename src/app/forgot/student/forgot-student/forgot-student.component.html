<mat-card class="standalone__content mat-elevation-z0 container-bg center">
  <mat-card-content>
    <standalone-logo />
    <h2 class="standalone__title accent" i18n>Student Forgot Username or Password</h2>
    <div class="forgot flex flex-col items-center justify-center sm:flex-row">
      <app-call-to-action
        class="flex-1 w-full"
        icon="account_circle"
        iconColor="accent"
        i18n-headline
        headline="Username"
        i18n-content
        content="Look up username"
        destination="username"
      ></app-call-to-action>
      <app-call-to-action
        class="flex-1 w-full"
        icon="lock"
        iconColor="accent"
        i18n-headline
        headline="Password"
        i18n-content
        content="Reset password"
        destination="password"
      ></app-call-to-action>
    </div>
  </mat-card-content>
</mat-card>
