<mat-card class="standalone__content mat-elevation-z0 container-bg center">
  <mat-card-content>
    <standalone-logo />
    <h2 class="standalone__title accent" i18n>Forgot Username or Password</h2>
    <div class="forgot flex flex-col items-center justify-center sm:flex-row">
      <app-call-to-action
        class="flex-1 w-full"
        icon="supervised_user_circle"
        iconColor="accent"
        i18n-headline
        headline="Student"
        i18n-content
        content="Look up username or reset password for a student account"
        destination="student"
      ></app-call-to-action>
      <app-call-to-action
        class="flex-1 w-full"
        icon="school"
        iconColor="accent"
        i18n-headline
        headline="Teacher"
        i18n-content
        content="Look up username or reset password for a teacher account"
        destination="teacher"
      ></app-call-to-action>
    </div>
  </mat-card-content>
</mat-card>
