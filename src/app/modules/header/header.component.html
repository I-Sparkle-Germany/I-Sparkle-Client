<header class="header">
  <mat-toolbar class="header__content">
    <div class="content flex flex-row items-center justify-start">
      <a routerLink="/" class="header__logo img-link">
        <picture>
          <source
            type="image/webp"
            srcset="assets/img/i-sparkle-logo.webp, assets/img/i-sparkle-logo@2x.webp 2x"
          />
          <source srcset="assets/img/i-sparkle-logo.png, assets/img/i-sparkle-logo@2x.png 2x" />
          <img src="assets/img/i-sparkle-logo@2x.png" i18n-alt alt="i-sparkle logo" />
        </picture>
      </a>
      <span class="flex-1"></span>
      <app-header-links class="hidden lg:block" [user]="user" [location]="location" />
      @if (roles.length > 0) {
        <app-header-account-menu [user]="user" />
      }
      @if (!location) {
        <span class="lg:hidden">
          <button mat-icon-button (click)="showMobileMenu()" i18n-aria-label aria-label="Main menu">
            <mat-icon>menu</mat-icon>
          </button>
        </span>
      }
    </div>
  </mat-toolbar>
</header>
